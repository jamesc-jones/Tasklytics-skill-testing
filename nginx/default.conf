# ---------------------------------
# RATE LIMIT (GLOBAL)
# ---------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ---------------------------------
# HTTP -> HTTPS REDIRECT
# ---------------------------------
server {
    listen 80;
    server_name tasklytics2ai.com www.tasklytics2ai.com;

    server_tokens off;

    location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    }		

    location ~ /\.(env|git) {
        deny all;
        return 403;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------
# PRODUCTION SERVER (HTTPS)
# ---------------------------------
server {
    listen 443 ssl;
    server_name tasklytics2ai.com www.tasklytics2ai.com;

    ssl_certificate     /etc/letsencrypt/live/tasklytics2ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasklytics2ai.com/privkey.pem;

    # ---------------------------------
    # SECURITY
    # ---------------------------------
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # ---------------------------------
    # BLOCK SENSITIVE FILES
    # ---------------------------------
    location ~ /\.(env|git) {
    deny all;
    return 403;
    }

    # Explicit allow for FastAPI's docs/schema, evaluated BEFORE the blanket
    # extension-blocking rule below. Exact match (=) has the highest precedence
    # in nginx - takes priority over any regex location regardless of file order,
    # so these two paths are guaranteed reachable no matter how the blocking
    # rules evolve later.
    location = /api/docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block exposed configuration and backup files
    location ~* \.(env|bak|backup|yaml|yml|json)$ {
        deny all;
        return 403;
    }

    # Block common sensitive filenames
    location ~* /(docker-compose|secrets|credentials|config|aws|phpinfo)\.(json|yml|yaml|env|php)?$ {
        deny all;
        return 403;
    }

    # ---------------------------------
    # FRONTEND
    # ---------------------------------
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------
    # BACKEND API (WITH RATE LIMIT)
    # ---------------------------------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
