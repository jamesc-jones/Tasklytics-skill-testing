# ---------------------------------
# RATE LIMIT (GLOBAL)
# ---------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ---------------------------------
# HTTP -> HTTPS REDIRECT
# ---------------------------------
server {
    listen 80;

    server_name tasklytics.app www.tasklytics.app;

    return 301 https://$host$request_uri;
}

# ---------------------------------
# HTTPS SERVER
# ---------------------------------
server {
    listen 443 ssl;
    server_name tasklytics.app www.tasklytics.app;

    ssl_certificate /etc/letsencrypt/live/tasklytics.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasklytics.app/privkey.pem;

    # ---------------------------------
    # SECURITY
    # ---------------------------------
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # ---------------------------------
    # BLOCK SENSITIVE FILES 
    # ---------------------------------
    location ~ /\.(env|git) { 
        deny all; 
        return 403; 
    }


    # ---------------------------------
    # FRONTEND
    # ---------------------------------
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------------------------------
    # BACKEND API (WITH RATE LIMIT)
    # ---------------------------------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}