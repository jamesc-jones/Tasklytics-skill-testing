services:
  backend:
    build:
      context: ./tasklytics-skill-testing-backend
    container_name: tasklytics_backend
    restart: always
    env_file:
      - ./tasklytics-skill-testing-backend/.env.docker
    depends_on:
      - db
    expose:
      - "8000"

  frontend:
    build:
      context: ./tasklytics-skill-testing-frontend
    container_name: tasklytics_frontend
    restart: always
    env_file:
      - ./tasklytics-skill-testing-frontend/.env
    depends_on:
      - backend
    expose:
      - "3000"

  db:
    image: postgres:15
    container_name: tasklytics_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: npg_QdFI4Eet6phB
      POSTGRES_DB: tasklytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  nginx:
    image: nginx:latest
    container_name: tasklytics_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
